name: Daily FNG Trading Simulation

on:
  schedule:
    # รันใกล้เวลาตลาดปิด (15:55 น. เวลานิวยอร์ก) เฉพาะวันจันทร์-ศุกร์
    # ตั้ง 2 ช่วงเวลาเผื่อ Daylight Saving Time ของสหรัฐฯ (เปลี่ยนเวลาปีละ 2 ครั้ง):
    #   19:55 UTC = 15:55 น. เวลานิวยอร์ก ช่วง EDT (มี.ค.-พ.ย. ประมาณ)
    #   20:55 UTC = 15:55 น. เวลานิวยอร์ก ช่วง EST (พ.ย.-มี.ค. ประมาณ)
    # โค้ดใน main.py จะเช็คเวลาตลาดจริงเองอีกชั้น (รวมวันหยุดตลาด) และมีระบบกันรันซ้ำ
    # ถ้า cron ทั้งสองช่วงตรงกับตลาดเปิดพร้อมกันในบางวันเปลี่ยนเวลา จะรันแค่ครั้งเดียวเท่านั้น
    - cron: "55 19 * * 1-5"
    - cron: "55 20 * * 1-5"
  workflow_dispatch: {}   # ให้กดรันเองได้จากแท็บ Actions

# สำคัญ: ต้องให้สิทธิ์เขียนกลับเข้า repo เพื่อบันทึก state.json / trade_log.csv
permissions:
  contents: write

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily strategy
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Commit updated state & trade log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/state.json data/trade_log.csv
          git diff --quiet --cached || git commit -m "Update state and trade log [skip ci]"
          git push
