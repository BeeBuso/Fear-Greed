name: Daily FNG Trading Simulation

on:
  schedule:
    # GitHub Actions ไม่รับประกันว่า schedule จะรันตรงเวลาเป๊ะ (อาจดีเลย์ได้หลายชั่วโมง
    # โดยเฉพาะช่วงระบบมีคิวงานเยอะ) จึงรันถี่ทุก 15 นาทีตลอดช่วงที่ตลาดน่าจะเปิดแทน
    # เพื่อไม่ให้พลาดช่วงตลาดเปิดแม้ GitHub จะดีเลย์การรันไปก็ตาม
    #
    # ช่วง UTC 13:00-21:59 ครอบคลุมเวลาตลาด NYSE (09:30-16:00 เวลานิวยอร์ก) ทั้ง
    # ช่วง EDT (มี.ค.-พ.ย.) และ EST (พ.ย.-มี.ค.) แบบมีกันชนเผื่อดีเลย์
    #
    # โค้ดใน main.py จะเช็คเวลาตลาดจริงเองทุกครั้งที่รัน (รวมวันหยุดตลาด) และมีระบบ
    # กันทำรายการซ้ำในวันเดียวกัน (has_run_today) จึงทำรายการแค่ครั้งเดียว/วันเท่านั้น
    # แม้จะมีการรันหลายสิบครั้งต่อวันก็ตาม (รันที่เหลือจะแค่เช็คแล้วข้ามอย่างรวดเร็ว)
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}   # ให้กดรันเองได้จากแท็บ Actions

# สำคัญ: ต้องให้สิทธิ์เขียนกลับเข้า repo เพื่อบันทึก state.json / trade_log.csv
permissions:
  contents: write

# กันไม่ให้ workflow รันซ้อนกันหลายรอบพร้อมกัน (เช่น กด Run workflow ซ้ำ หรือ cron 2 ช่วงเวลาทับกัน)
# ถ้ามีรอบใหม่เข้ามาระหว่างที่รอบเก่ายังไม่เสร็จ จะ "รอคิว" แทนที่จะรันพร้อมกัน
concurrency:
  group: fng-trader-daily-run
  cancel-in-progress: false

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily strategy
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Commit updated state & trade log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/state.json data/trade_log.csv
          if git diff --quiet --cached; then
            echo "ไม่มีอะไรเปลี่ยนแปลง - ข้ามการ commit"
            exit 0
          fi
          git commit -m "Update state and trade log [skip ci]"
          # ดึงข้อมูลล่าสุดมารวมก่อน push กันกรณีมีการ push อื่นแทรกเข้ามา (rebase ทับ commit ของเราไว้บนสุด)
          git pull --rebase origin main || true
          git push
